[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetcher"
version = "0.1.0"
description = "1688 采集重构：网络层 / 原子能力 / 场景判断 / 策略 / 站点插件 的面向对象采集框架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "requests>=2.31",
]

# cloakbrowser 为重依赖（商业二进制 + license 席位），仅运行时按需延迟导入；
# 安装本体：pip install -e ".[cloak]"
[project.optional-dependencies]
cloak = ["cloakbrowser"]
dev = ["pytest"]

[project.scripts]
fetcher = "fetcher.cli.main:main"

[tool.setuptools.packages.find]
include = ["fetcher*"]

[tool.setuptools.package-data]
fetcher = ["assets/*.json"]
